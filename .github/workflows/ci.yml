name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        # -p 1: the api and store packages reset the same test database, so
        # they must not run at the same time. -race: the hub and WebSocket
        # sessions are shared across goroutines.
        env:
          RELAY_TEST_DSN: postgres://relay:relay@localhost:5432/relay_test?sslmode=disable
        run: go test -race -count=1 -p 1 ./...
      - name: govulncheck
        # Known vulnerabilities in dependencies or the Go standard library
        # that the server's code actually reaches.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  ios:
    name: iOS app and Swift packages
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Cache libsignal
        uses: actions/cache@v4
        with:
          path: third_party
          key: libsignal-${{ hashFiles('scripts/setup-libsignal.sh') }}
      - name: Vendor libsignal
        run: scripts/setup-libsignal.sh
      - name: Pick a simulator
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if ".SimRuntime.iOS-" in k
                        and any(d["name"].startswith("iPhone") for d in devices[k])),
                       key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[1].split("-")])
          phones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])
          ')"
          echo "SIMULATOR=id=$udid" >> "$GITHUB_ENV"
      - name: Test CryptoCore
        working-directory: CryptoCore
        run: xcodebuild test -scheme CryptoCore -destination "$SIMULATOR" -quiet
      - name: Test RelayKit
        working-directory: RelayKit
        run: xcodebuild test -scheme RelayKit -destination "$SIMULATOR" -quiet
      - name: Test SecureStorage
        working-directory: SecureStorage
        run: xcodebuild test -scheme SecureStorage -destination "$SIMULATOR" -quiet
      - name: Test RelayCore
        working-directory: RelayCore
        run: xcodebuild test -scheme RelayCore -destination "$SIMULATOR" -quiet
      - name: Test Watch app
        # Unit tests plus UI tests that drive the watch app on its built-in
        # test chats (no paired iPhone in the simulator).
        run: |
          watch="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          os = sorted((k for k in devices if ".SimRuntime.watchOS-" in k and devices[k]),
                      key=lambda k: [int(p) for p in k.rsplit("watchOS-", 1)[1].split("-")])
          print(devices[os[-1]][0]["udid"])
          ')"
          xcodebuild test -project Relay.xcodeproj -scheme "RelayWatch Watch App" \
            -destination "id=$watch" CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build app
        # Simulator build without signing: catches compile errors in the app
        # and its extensions.
        # The full log is thousands of warning lines; print only the errors.
        run: |
          if ! xcodebuild build -project Relay.xcodeproj -scheme Relay \
              -destination "$SIMULATOR" CODE_SIGNING_ALLOWED=NO -quiet > build.log 2>&1; then
            grep -E -A3 "error:" build.log | head -200
            exit 1
          fi
