// content.proto — the CLIENT-ONLY plaintext structure of a message.
//
// A serialized Content message is what gets encrypted with the Double
// Ratchet (or a sender key, for groups). The relay server never parses
// this; it only ever sees the resulting ciphertext bytes inside
// relay.v1.Envelope.content / DeviceMessage.content.
//
// Both the iOS client and future clients (Windows, Android) must codegen
// from this exact file — wire compatibility depends on it.

syntax = "proto3";

package relay.content;

option go_package = "github.com/relayapp/relay-server/gen/contentpb";

message Content {
  oneof body {
    TextMessage text = 1;
    ReceiptMessage receipt = 2;
    TypingMessage typing = 3;
    ReactionMessage reaction = 4;
    SenderKeyDistribution sender_key_distribution = 5;
    GroupUpdate group_update = 6;
    DeleteMessage delete = 7;
    ProfileUpdate profile = 9;
    CallMessage call = 10;
    EditMessage edit = 11;
    PollMessage poll = 17;
    PollVote poll_vote = 18;
  }
  // Set when this content belongs to a group; empty for 1:1. Group messages
  // are encrypted with the sender's sender key (senderKey ciphertext);
  // control content (SKDM, group updates) is sent over pairwise sessions.
  string group_id = 8;
  // Random bytes added before E2EE encryption so the relay observes fewer exact
  // plaintext-size differences. Clients ignore this field after decrypting.
  bytes padding = 12;
  // Sealed sender: sender's own account id and device id, encrypted inside the
  // Content so the relay's stored envelope can omit them without breaking decryption.
  // Clients MUST set these on every outgoing message. Recipients prefer these over
  // the Envelope's (server-stamped) sender fields.
  string sender_account_id = 13;
  uint32 sender_device_id = 14;
  // Disappearing-messages timer the sender had set for this conversation when the
  // message was composed, in milliseconds. 0 means no timer / no change. Recipients
  // sync their local timer to this value so both sides stay in lockstep.
  int64 expires_after_ms = 15;
  // Set only on sync copies sent to the sender's own other devices. Contains the
  // peer account id of the original recipient so the linked device can store the
  // message in the correct conversation as an outgoing message.
  string sync_recipient = 16;
}

// Carries a libsignal Sender Key Distribution Message so a member can
// decrypt this sender's group messages. Sent 1:1 (pairwise-encrypted) to
// each member when joining a group or rotating the sender key.
message SenderKeyDistribution {
  bytes data = 1;             // serialized SKDM
  string distribution_id = 2; // UUID identifying the sender-key epoch
}

// Notifies members that a group's roster/metadata changed; recipients
// re-sync the authoritative roster from the relay. `revision` lets clients
// drop stale updates; the rest drives a human-readable system line.
message GroupUpdate {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    CREATE = 1;
    ADD = 2;
    REMOVE = 3;
    LEAVE = 4;
    RENAME = 5;
    DESCRIBE = 6;        // group description changed
    AVATAR = 7;          // group avatar changed
    PROMOTE_ADMIN = 8;   // target was promoted to admin
    DEMOTE_ADMIN = 9;    // target was demoted from admin
    SET_ANNOUNCE_ONLY = 10; // announce_only toggled
  }
  int64 revision = 1;
  Action action = 2;
  string actor = 3;             // account id that made the change
  string target = 4;            // affected member (add/remove/promote/demote)
  string name = 5;              // group name (create/rename)
  string description = 6;       // group description (describe)
  AttachmentPointer avatar = 7; // group avatar blob pointer (avatar action)
  // Full member list after this change. Included by the sender on CREATE, ADD,
  // REMOVE, and LEAVE so recipients can update their local roster.
  repeated string members = 8;
  // Full admin list after this change (promote/demote actions).
  repeated string admins = 9;
  // New announce-only state (SET_ANNOUNCE_ONLY action).
  bool announce_only = 10;
  // The group's current sender-key epoch. Carried E2E (was server-managed) so
  // clients agree on it without a server round-trip. On member REMOVE the actor
  // rotates this to a fresh id, forcing new sender keys the removed member can't
  // read. Empty on metadata-only actions (recipients keep their current id).
  string distribution_id = 11;
  // Group invite capability. Carried on normal updates so every member stores
  // it, and echoed by a link-joiner in their self-add so members can verify the
  // joiner actually held a valid invite link (they never learn the joiner is an
  // admin). Rotating it revokes outstanding links. Empty when the group has no
  // active invite link.
  bytes invite_key = 12;
}

message TextMessage {
  string body = 1;
  // Sender's clock, milliseconds since epoch. Doubles as the message id
  // that receipts refer back to (Signal's convention).
  int64 timestamp = 2;
  // Optional: set when this message is a reply to an earlier one.
  Quote quote = 3;
  // Optional media; a message may carry text and/or attachments.
  repeated AttachmentPointer attachments = 4;
}

// Points at an encrypted blob on the relay. The relay stores only the
// opaque ciphertext (AES-256-GCM: nonce‖ciphertext‖tag); the key and digest
// travel end-to-end inside the encrypted Content, never to the server.
message AttachmentPointer {
  string id = 1;            // relay blob id
  bytes key = 2;            // AES-256-GCM key (32 bytes)
  bytes digest = 3;         // SHA-256 of the uploaded ciphertext (integrity)
  string content_type = 4;  // MIME type
  uint64 size = 5;          // ciphertext size in bytes
  string filename = 6;
  uint32 width = 7;         // pixels (images)
  uint32 height = 8;        // pixels (images)
}

// A sender's self-set profile (display name + optional avatar). Sent over a
// pairwise session to a peer so it stays end-to-end encrypted — the relay
// only ever sees the ciphertext and the (already-encrypted) avatar blob. The
// avatar reuses the AttachmentPointer/AES-256-GCM blob pipeline. Recipients
// keep the newest by `timestamp`.
message ProfileUpdate {
  string display_name = 1;
  AttachmentPointer avatar = 2; // optional; unset means no photo
  int64 timestamp = 3;          // sender clock; newest wins
}

// A snapshot of the message being replied to. Self-contained (carries the
// quoted text) so the reply renders without a lookup and survives the
// original being deleted, following Signal's model.
message Quote {
  // Sender clock (== message id) of the quoted message.
  int64 target_timestamp = 1;
  // Account id of the quoted message's author.
  string author = 2;
  // Snapshot of the quoted text; the sender truncates long bodies.
  string text = 3;
}

// "Unsend" / delete-for-everyone: instructs the recipient to remove a
// message the sender previously sent. Delivered like any message (queued
// when offline) so it applies even if the peer wasn't online. Only the
// original author may delete their own message; the recipient locates it by
// (conversation with the sender, target_timestamp). The client leaves a
// "message was deleted" tombstone rather than erasing the row.
message DeleteMessage {
  // Sender clock (== message id) of the message to delete.
  int64 target_timestamp = 1;
  // Account id of the message's author (always the sender of this delete).
  string target_author = 2;
}

// An emoji reaction attached to an earlier message. Delivered like any
// message (queued when offline) rather than ephemerally, so reactions
// aren't lost. One reaction per author per message; a new one replaces the
// previous, and remove = true retracts it.
message ReactionMessage {
  // The emoji applied. Ignored when remove = true.
  string emoji = 1;
  // Identifies the reacted-to message: its author + sender clock.
  string target_author = 2;
  int64 target_timestamp = 3;
  // Retract this author's reaction on the target message.
  bool remove = 4;
  // Sender's clock when the reaction was made.
  int64 timestamp = 5;
}

// Delivery and read receipts are end-to-end encrypted like any message.
// Read receipts sent to the user's own other devices (sync) keep
// multi-device read state consistent.
message ReceiptMessage {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_DELIVERY = 1;
    TYPE_READ = 2;
  }
  Type type = 1;
  // client_timestamps of the messages being receipted.
  repeated int64 message_timestamps = 2;
}

// Call signalling — all types use the same message; the type field selects
// the interpretation. OFFER and HANGUP are non-ephemeral so they queue for
// offline devices. ANSWER, ICE, RINGING, and BUSY are sent ephemeral.
// GROUP_RING is non-ephemeral (must wake offline devices). GROUP_JOIN and
// GROUP_LEAVE are ephemeral.
message CallMessage {
  enum Type {
    OFFER      = 0;
    ANSWER     = 1;
    ICE        = 2;
    HANGUP     = 3;
    BUSY       = 4;
    RINGING    = 5;
    GROUP_RING  = 6;  // initiator → all members: "join this group call"
    GROUP_JOIN  = 7;  // member → all: "I joined; initiate mesh SDP with me"
    GROUP_LEAVE = 8;  // member → all: "I left the call"
  }
  Type   type    = 1;
  string call_id = 2;  // stable UUID for the entire call session
  string sdp     = 3;  // SDP blob for OFFER / ANSWER
  string ice     = 4;  // JSON-encoded RTCIceCandidate for ICE
  // Group call fields — empty for 1:1 calls.
  string group_id       = 5;  // conversation group ID for group calls
  string target_account = 6;  // mesh OFFER/ANSWER/ICE: which peer this is for
  repeated string participants = 7;  // GROUP_RING: full participant list
}

// Edits a previously sent message in-place. Only the original author may edit;
// the recipient locates the target by (conversation, target_timestamp) and
// replaces its body. Attachments are not editable.
message EditMessage {
  // Sender clock of the original message (its stable message id).
  int64 target_timestamp = 1;
  // Replacement body text.
  string new_body = 2;
}

// A poll sent in a conversation. Recipients cast votes via PollVote messages;
// vote tallies are aggregated client-side from received votes.
message PollMessage {
  string question = 1;
  repeated string options = 2;
  // When true, voters may select multiple options.
  bool multi_select = 3;
  // Sender's clock; used as the stable poll id that PollVote messages reference.
  int64 timestamp = 4;
}

// A vote cast on a PollMessage identified by (poll_author, poll_timestamp).
// Sending a new vote for the same poll replaces the previous selection.
message PollVote {
  string poll_author = 1;         // account id of the poll creator
  int64 poll_timestamp = 2;       // timestamp field from the PollMessage
  repeated uint32 selected_options = 3; // zero-based option indices
  int64 timestamp = 4;            // sender's clock for ordering
}

// Sent with Envelope.ephemeral = true; never queued for offline devices.
message TypingMessage {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_STARTED = 1;
    ACTION_STOPPED = 2;
  }
  Action action = 1;
  int64 timestamp = 2;
}
